name: CI

# Runs the backend and frontend test suites (and a production frontend
# build) on every push and PR against main. This is Ledger's only
# pre-deploy check today — server-deploy.sh has no idea whether the code it
# builds actually works until this has already passed.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # 3.12 to match the Dockerfile's python:3.12-slim base image — a
      # version mismatch here is exactly the kind of thing that passes CI
      # and then breaks in production.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest
        run: pytest -v

  frontend:
    name: Frontend tests + build (vitest / vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # 20 to match the Dockerfile's node:20-alpine build stage.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run vitest
        run: npm run test

      # Same-origin production build, exactly as the Dockerfile's
      # frontend-build stage runs it — catches anything a unit test
      # wouldn't (a bad import, a JSX syntax error, an unresolved asset).
      - name: Production build
        run: npm run build

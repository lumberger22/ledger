<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=0.5, maximum-scale=1.0"
    />
    <title>Ledger</title>
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!--
      Resolve light/dark before first paint — see public/theme-init.js for
      why this is a separate same-origin file instead of an inline script.
    -->
    <script src="/theme-init.js"></script>

    <!-- PWA / "Add to Home Screen" -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#2a6f6a" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1513" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Ledger" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-canvas">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
